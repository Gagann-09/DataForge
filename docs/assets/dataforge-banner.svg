<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#000000; font-family:'JetBrains Mono', ui-monospace, Consolas, monospace;">
  <defs>
    <radialGradient id="halo" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8fb4ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8fb4ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#8fb4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grids & Ambient Glows -->
  <rect width="1200" height="340" fill="#020202"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#halo)"/>
  <rect width="1200" height="340" fill="url(#accentGlow)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Corner Tech Reticles -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <path d="M 1184 32 L 1184 16 L 1168 16" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <path d="M 16 308 L 16 324 L 32 324" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <path d="M 1184 308 L 1184 324 L 1168 324" fill="none" stroke="#8fb4ff" stroke-width="2"/>

  <!-- Status Live Pulse -->
  <g transform="translate(64, 48)">
    <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#glow)"/>
    <circle cx="6" cy="6" r="3" fill="#34d399"/>
    <text x="20" y="10" fill="#10b981" font-size="11" font-weight="700" letter-spacing="2">SYSTEM STATUS: ALL ENGINES OPERATIONAL</text>
    <text x="440" y="10" fill="#555555" font-size="11">|</text>
    <text x="460" y="10" fill="#8a8a8a" font-size="11" letter-spacing="1.5">v2.4.0 · RELEASE READY</text>
  </g>

  <!-- Brand Title -->
  <text x="64" y="136" fill="#f5f5f5" font-family="'Barlow Condensed', Impact, sans-serif" font-size="76" font-weight="900" letter-spacing="3">DATAFORGE</text>
  <text x="495" y="106" fill="#8fb4ff" font-size="34">✦</text>

  <!-- Subheadline -->
  <text x="64" y="180" fill="#8fb4ff" font-size="15" font-weight="700" letter-spacing="3">HIGH-THROUGHPUT CLICKSTREAM INTELLIGENCE &amp; REAL-TIME ANALYTICS</text>
  <text x="64" y="210" fill="#8a8a8a" font-size="13" font-family="'JetBrains Mono', Consolas, monospace;">Deterministic event ingestion, 6-index MongoDB pipelines, and live telemetry for 150,000+ events.</text>

  <!-- Tech Metric Badges -->
  <g transform="translate(64, 252)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="230" height="42" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>
    <text x="14" y="18" fill="#8a8a8a" font-size="9" letter-spacing="1">BASELINE STORAGE</text>
    <text x="14" y="34" fill="#f5f5f5" font-size="13" font-weight="700">150,002 EVENTS</text>

    <!-- Badge 2 -->
    <rect x="246" y="0" width="230" height="42" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>
    <text x="260" y="18" fill="#8a8a8a" font-size="9" letter-spacing="1">INGESTION THROUGHPUT</text>
    <text x="260" y="34" fill="#8fb4ff" font-size="13" font-weight="700">5,000 EVT / BATCH</text>

    <!-- Badge 3 -->
    <rect x="492" y="0" width="230" height="42" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>
    <text x="506" y="18" fill="#8a8a8a" font-size="9" letter-spacing="1">LIVE TELEMETRY POLLING</text>
    <text x="506" y="34" fill="#34d399" font-size="13" font-weight="700">5-SECOND CYCLES</text>

    <!-- Badge 4 -->
    <rect x="738" y="0" width="230" height="42" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>
    <text x="752" y="18" fill="#8a8a8a" font-size="9" letter-spacing="1">SECURITY &amp; AUDIT</text>
    <text x="752" y="34" fill="#f5f5f5" font-size="13" font-weight="700">CODEQL + ZERO SECRETS</text>
  </g>

  <!-- Particle simulation decorative nodes -->
  <g opacity="0.6">
    <circle cx="1020" cy="110" r="2" fill="#8fb4ff"/>
    <circle cx="1060" cy="80" r="3" fill="#8fb4ff" opacity="0.8"/>
    <circle cx="1120" cy="140" r="1.5" fill="#8fb4ff"/>
    <circle cx="1090" cy="190" r="2.5" fill="#8fb4ff"/>
    <circle cx="1000" cy="220" r="2" fill="#8fb4ff"/>
    <circle cx="1140" cy="240" r="1.5" fill="#8fb4ff"/>
    <circle cx="970" cy="160" r="3" fill="#8fb4ff" opacity="0.4"/>
    <line x1="1020" y1="110" x2="1060" y2="80" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="1060" y1="80" x2="1120" y2="140" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="1120" y1="140" x2="1090" y2="190" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="1090" y1="190" x2="1000" y2="220" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="1000" y1="220" x2="970" y2="160" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
    <line x1="970" y1="160" x2="1020" y2="110" stroke="#8fb4ff" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>
