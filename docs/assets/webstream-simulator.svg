<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480" style="background:#000000; font-family:'JetBrains Mono', ui-monospace, Consolas, monospace;">
  <defs>
    <filter id="simGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fb4ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8fb4ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#030303"/>
  <rect width="1200" height="480" fill="none" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Title Section -->
  <g transform="translate(40, 36)">
    <circle cx="8" cy="8" r="4" fill="#10b981" filter="url(#simGlow)"/>
    <text x="24" y="12" fill="#10b981" font-size="11" font-weight="700" letter-spacing="2">REAL-TIME WEBSTREAM &amp; SIMULATOR INTERACTION ARCHITECTURE</text>
    <text x="0" y="44" fill="#f5f5f5" font-family="'Barlow Condensed', Impact, sans-serif" font-size="28" font-weight="800" letter-spacing="1">END-TO-END STREAMING INGESTION &amp; REACTIVE TELEMETRY</text>
  </g>

  <!-- 3 Stages: Terminal Simulator -> Ingestion & Storage -> Live Dashboard -->

  <!-- Stage 1: Terminal / Simulator -->
  <g transform="translate(40, 115)">
    <!-- Terminal Window Box -->
    <rect width="340" height="320" fill="#000000" stroke="#1f1f1f"/>
    <rect width="340" height="30" fill="#0a0a0a" stroke="#1f1f1f"/>
    <!-- Window controls -->
    <circle cx="15" cy="15" r="4" fill="#ff5f56"/>
    <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
    <circle cx="45" cy="15" r="4" fill="#27c93f"/>
    <text x="80" y="19" fill="#8a8a8a" font-size="10">bash · npm run simulate</text>

    <!-- Terminal Code & Stream Logs -->
    <g transform="translate(14, 48)">
      <text x="0" y="16" fill="#8a8a8a" font-size="10">$ npm run simulate -- --run --duration 60</text>

      <text x="0" y="44" fill="#8fb4ff" font-size="10">[SIMULATOR] Starting live stream...</text>
      <text x="0" y="64" fill="#8a8a8a" font-size="10">Target: http://localhost:4000/api/ingest</text>
      <text x="0" y="84" fill="#8a8a8a" font-size="10">Batch Rate: 5–25 events / 2s</text>

      <line x1="0" y1="100" x2="312" y2="100" stroke="#141414"/>

      <!-- Live Stream Logs -->
      <text x="0" y="124" fill="#10b981" font-size="9">✔ Batch 1 · 18 events · HTTP 201 (14ms)</text>
      <text x="0" y="144" fill="#10b981" font-size="9">✔ Batch 2 · 22 events · HTTP 201 (18ms)</text>
      <text x="0" y="164" fill="#10b981" font-size="9">✔ Batch 3 · 15 events · HTTP 201 (12ms)</text>
      <text x="0" y="184" fill="#10b981" font-size="9">✔ Batch 4 · 24 events · HTTP 201 (20ms)</text>
      <text x="0" y="204" fill="#10b981" font-size="9">✔ Batch 5 · 19 events · HTTP 201 (15ms)</text>

      <!-- Stream Metrics Box -->
      <rect y="222" width="312" height="42" fill="#080808" stroke="#1f1f1f"/>
      <text x="10" y="238" fill="#8a8a8a" font-size="9">STREAM THROUGHPUT</text>
      <text x="10" y="254" fill="#34d399" font-size="11" font-weight="700">~588 EVENTS / MIN (ACTIVE)</text>
    </g>
  </g>

  <!-- Flow Arrow 1: Simulator to Engine -->
  <g transform="translate(385, 250)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="url(#streamGrad)" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="45,-4 55,0 45,4" fill="#8fb4ff"/>
    <text x="-15" y="-14" fill="#8fb4ff" font-size="9">POST /api/ingest</text>
    <text x="-5" y="20" fill="#8a8a8a" font-size="8">JSON payload</text>
  </g>

  <!-- Stage 2: DataForge Core Engine -->
  <g transform="translate(445, 115)">
    <rect width="320" height="320" fill="#050505" stroke="#1f1f1f"/>
    <rect width="320" height="30" fill="#080808" stroke="#1f1f1f"/>
    <text x="14" y="19" fill="#f5f5f5" font-size="11" font-weight="700">DATAFORGE CORE ENGINE</text>

    <g transform="translate(14, 46)">
      <!-- Pipeline Block 1 -->
      <rect width="292" height="48" fill="#000000" stroke="#1f1f1f"/>
      <text x="12" y="18" fill="#8a8a8a" font-size="9">1. VALIDATION &amp; INGESTION</text>
      <text x="12" y="36" fill="#f5f5f5" font-size="10" font-weight="700">Schema Check · Unordered Bulk Write</text>

      <!-- Pipeline Block 2 -->
      <rect y="58" width="292" height="64" fill="#000000" stroke="#1f1f1f"/>
      <text x="12" y="76" fill="#8a8a8a" font-size="9">2. STORAGE &amp; 6-INDEX ROUTING</text>
      <text x="12" y="94" fill="#8fb4ff" font-size="10" font-weight="700">MongoDB · dataforge.events</text>
      <text x="12" y="110" fill="#8a8a8a" font-size="8">Indexes: eventId_1 (unique), type_ts, productId_ts, ts</text>

      <!-- Pipeline Block 3 -->
      <rect y="132" width="292" height="60" fill="#000000" stroke="#1f1f1f"/>
      <text x="12" y="150" fill="#8a8a8a" font-size="9">3. REAL-TIME AGGREGATION PIPELINES</text>
      <text x="12" y="168" fill="#10b981" font-size="10" font-weight="700">P1 Top Products · P2 Funnel · P3 CLV</text>
      <text x="12" y="182" fill="#8a8a8a" font-size="8">Optimized pipeline stages: $match → $group → $project</text>

      <!-- Hardened Security Strip -->
      <rect y="202" width="292" height="54" fill="#080808" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="220" fill="#10b981" font-size="9" font-weight="700">SHIELDED RUNTIME (M5 HARDENED)</text>
      <text x="12" y="236" fill="#8a8a8a" font-size="8">Rate Limiter (120 req/min) · Secret Redaction</text>
      <text x="12" y="248" fill="#8a8a8a" font-size="8">CodeQL Validated · Graceful Exit Promotion</text>
    </g>
  </g>

  <!-- Flow Arrow 2: Engine to Dashboard -->
  <g transform="translate(770, 250)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="url(#streamGrad)" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="45,-4 55,0 45,4" fill="#10b981"/>
    <text x="-15" y="-14" fill="#10b981" font-size="9">GET /api/stats (5s)</text>
    <text x="-5" y="20" fill="#8a8a8a" font-size="8">Reactive Polling</text>
  </g>

  <!-- Stage 3: Live Dashboard UI -->
  <g transform="translate(830, 115)">
    <rect width="330" height="320" fill="#000000" stroke="#1f1f1f"/>
    <rect width="330" height="30" fill="#0a0a0a" stroke="#1f1f1f"/>
    <text x="14" y="19" fill="#f5f5f5" font-size="11" font-weight="700">REACTIVE VEXON UI (5S POLL)</text>
    <circle cx="310" cy="15" r="4" fill="#10b981" filter="url(#simGlow)"/>

    <g transform="translate(14, 46)">
      <!-- Metric Card 1 -->
      <rect width="144" height="62" fill="#050505" stroke="#1f1f1f"/>
      <text x="10" y="18" fill="#8a8a8a" font-size="8">[ TOTAL DOCS ]</text>
      <text x="10" y="44" fill="#f5f5f5" font-family="'Barlow Condensed', Impact, sans-serif" font-size="24" font-weight="800">150,002 +</text>
      <text x="88" y="44" fill="#10b981" font-size="9">▲ LIVE</text>

      <!-- Metric Card 2 -->
      <rect x="156" y="0" width="144" height="62" fill="#050505" stroke="#1f1f1f"/>
      <text x="166" y="18" fill="#8a8a8a" font-size="8">[ EVENTS / MIN ]</text>
      <text x="166" y="44" fill="#8fb4ff" font-family="'Barlow Condensed', Impact, sans-serif" font-size="24" font-weight="800">588.0</text>

      <!-- Live Mini Chart Visual -->
      <rect y="72" width="300" height="90" fill="#050505" stroke="#1f1f1f"/>
      <text x="10" y="88" fill="#8a8a8a" font-size="8">REAL-TIME INGESTION WAVEFORM</text>

      <!-- Waveform path -->
      <path d="M 10 140 L 40 135 L 70 120 L 100 128 L 130 110 L 160 115 L 190 98 L 220 105 L 250 88 L 280 92 L 300 85" fill="none" stroke="#8fb4ff" stroke-width="2"/>
      <circle cx="300" cy="85" r="3" fill="#10b981" filter="url(#simGlow)"/>

      <!-- Live Notification Banner -->
      <rect y="172" width="300" height="64" fill="#080808" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="190" fill="#10b981" font-size="9" font-weight="700">✦ STREAMING SYNCHRONIZED</text>
      <text x="10" y="208" fill="#f5f5f5" font-size="9">Dashboard automatically reflects</text>
      <text x="10" y="222" fill="#8a8a8a" font-size="8">new sessions, conversion spikes, &amp; revenue</text>
    </g>
  </g>
</svg>
