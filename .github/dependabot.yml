version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'

  # Maintain root npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  # Maintain server npm dependencies
  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps-server)'

  # Maintain client npm dependencies
  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps-client)'
